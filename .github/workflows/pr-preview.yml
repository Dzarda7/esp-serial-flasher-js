name: Deploy PR preview

# Deploys a live preview of the demo for each pull request to
# gh-pages/pr-preview/pr-<number>/ and comments the link on the PR.
# The preview is removed automatically when the PR is closed.
#
# Note: previews only run for PRs from branches in this repository. PRs from
# forks don't get a write token, so they won't produce a preview (by design).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        if: github.event.action != 'closed'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r web src dist _site/
          touch _site/.nojekyll

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
