name: Deploy demo to GitHub Pages

# Publishes the web demo to the gh-pages branch on every push to master.
# The compiled WASM in dist/ is committed, so no Emscripten build runs here —
# CI just assembles the static files the demo needs and pushes them.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r web src dist _site/
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          # Keep per-PR preview folders alive across production deploys.
          clean-exclude: pr-preview/
